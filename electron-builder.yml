appId: com.alwynthomas.mahi
productName: MAHI
copyright: Copyright © 2026 Alwyn Thomas
directories:
  output: release/${version}
  buildResources: build
publish:
  provider: github
  owner: alwynthomasdev
  repo: MAHI
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
# Shipped alongside the asar so the BrowserWindow can set its icon at runtime.
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  target:
    - nsis
  icon: build/icon.png
  artifactName: ${productName}-${version}-Setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  # Separate Intel and Apple Silicon installers; latest-mac.yml lists both.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  icon: build/icon.png
linux:
  target:
    - AppImage
  category: Utility
  icon: build/icon.png
